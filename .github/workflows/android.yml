name: Сборка для Android

# Общая сборка APK — для приложений на kit. Приложение вызывает её из своего сценария сборок:
#
#   jobs:
#     android:
#       uses: primus-fixer/kit/.github/workflows/android.yml@<версия kit>
#       with:
#         title: Полка
#         key-alias: polka
#         kit-ref: <та же версия kit>
#       secrets:
#         ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
#         ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
#         ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
#
# Android-проект создаёт `tauri android init`; его донастраивает общий скрипт kit
# (scripts/android-patch.sh), затем — свой скрипт приложения scripts/android-patch.sh, если он есть.
# С ключом подписи APK подписан постоянным ключом и ставится поверх прежнего; без ключа — отладочная
# сборка. Готовый файл — в артефакте «<программа>-android»: «<Название>-<версия>.apk».

on:
  workflow_call:
    inputs:
      title:
        description: Название под иконкой на телефоне, например «Полка»
        type: string
        required: true
      key-alias:
        description: Псевдоним ключа подписи, если не задан секретом ANDROID_KEY_ALIAS
        type: string
        required: true
      kit-ref:
        description: "Версия kit, из которой взять общую донастройку Android, — та же, что после @ в uses"
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE:
        description: Хранилище ключей подписи (.jks) в base64
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        description: Пароль хранилища и ключа
        required: false
      ANDROID_KEY_ALIAS:
        description: Псевдоним ключа, если он не такой, как в key-alias
        required: false

permissions:
  contents: read

jobs:
  android:
    name: Android — APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK и NDK
        run: |
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "platform-tools" > /dev/null
          NDK="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          BIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # OpenSSL при сборке ищет aarch64-linux-android-ranlib, а в NDK есть только llvm-ranlib.
          {
            echo "NDK_HOME=${NDK}"
            echo "RANLIB_aarch64_linux_android=${BIN}/llvm-ranlib"
            echo "AR_aarch64_linux_android=${BIN}/llvm-ar"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Имя и версия
        id: app
        run: |
          CONF=app/src-tauri/tauri.conf.json
          {
            echo "bin=$(node -p "require('./$CONF').mainBinaryName")"
            echo "product=$(node -p "require('./$CONF').productName")"
            echo "version=$(node -p "require('./$CONF').version")"
          } >> "$GITHUB_OUTPUT"
      - name: Пакеты интерфейса
        run: npm ci
        working-directory: app
      # Общая донастройка Android — из kit той же версии, что и этот сценарий.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: primus-fixer/kit
          ref: ${{ inputs.kit-ref }}
          path: .kit
          sparse-checkout: scripts
          persist-credentials: false
      - name: Android-проект
        working-directory: app
        env:
          TITLE: ${{ inputs.title }}
        run: |
          if [ ! -d src-tauri/gen/android ]; then npm run tauri android init -- --ci; fi
          bash ../.kit/scripts/android-patch.sh src-tauri/gen/android src-tauri/icons/android "$TITLE"
          if [ -f ../scripts/android-patch.sh ]; then bash ../scripts/android-patch.sh src-tauri/gen/android; fi
      # Ключ подписи — только в шаге подписи: компилятор и пакеты сборки его не видят.
      - name: Есть ли ключ подписи
        id: keys
        env:
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: echo "signed=$HAS_KEY" >> "$GITHUB_OUTPUT"
      - name: Сборка APK
        working-directory: app
        env:
          SIGNED: ${{ steps.keys.outputs.signed }}
          PRODUCT: ${{ steps.app.outputs.product }}
          VERSION: ${{ steps.app.outputs.version }}
        run: |
          mkdir -p out
          OUTPUTS=src-tauri/gen/android/app/build/outputs/apk
          if [ "$SIGNED" = "true" ]; then
            # Выпускная сборка: подпишем постоянным ключом в следующем шаге — обновления ставятся поверх.
            npm run tauri android build -- --apk --target aarch64
            APK=$(find "$OUTPUTS" -name '*-release*.apk' | head -1)
            if [ -z "$APK" ]; then echo "Не найден APK для подписи"; find "$OUTPUTS" -name '*.apk'; exit 1; fi
            cp "$APK" "$RUNNER_TEMP/unsigned.apk"
          else
            # Без ключа — отладочная сборка: её подпись меняется от сборки к сборке.
            npm run tauri android build -- --debug --apk --target aarch64
            APK=$(find "$OUTPUTS" -name '*.apk' | head -1)
            cp "$APK" "out/$PRODUCT-$VERSION-debug.apk"
            echo "::warning::Нет секретов ANDROID_KEYSTORE и ANDROID_KEYSTORE_PASSWORD — собрана отладочная версия. Перед её установкой старую версию придётся удалить."
          fi
      - name: Подпись APK
        if: steps.keys.outputs.signed == 'true'
        working-directory: app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DEFAULT_ALIAS: ${{ inputs.key-alias }}
          PRODUCT: ${{ steps.app.outputs.product }}
          VERSION: ${{ steps.app.outputs.version }}
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.jks"
          trap 'rm -f "$RUNNER_TEMP/app.jks"' EXIT
          "$BT/zipalign" -P 16 -f 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk" || "$BT/zipalign" -p -f 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/app.jks" --ks-key-alias "${KEY_ALIAS:-$DEFAULT_ALIAS}" \
            --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS --v4-signing-enabled false \
            --out "out/$PRODUCT-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "out/$PRODUCT-$VERSION.apk"
          ls -la out
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.app.outputs.bin }}-android
          path: app/out/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Android-проект для разбора
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-project
          path: |
            app/src-tauri/gen/android
            !app/src-tauri/gen/android/**/build/**
            !app/src-tauri/gen/android/**/jniLibs/**
            !app/src-tauri/gen/android/.gradle/**
          if-no-files-found: ignore
          retention-days: 3
