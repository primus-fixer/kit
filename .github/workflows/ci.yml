name: Проверки

on:
  push:
  workflow_dispatch:

# Проверкам токен GitHub нужен только для чтения кода.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux
      - name: Библиотеки WebKit для Tauri
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - run: cargo test --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings

  windows:
    name: Windows — ключ в DPAPI и вход
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows
      # Ключ, сохранённый приложениями до модуля, открывается модулем.
      - run: cargo test -p kit-secure -p kit-core
      # Вход с Windows Hello здесь только собирается: проверочная программа с Tauri на Windows
      # не запускается без описания окна (0xc0000139), сами проверки входа идут на Linux.
      - run: cargo check -p kit-tauri --all-targets

  android:
    name: Android — ключ в Keystore собирается
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      # Только код работы с Keystore; вход целиком собирается сборкой приложения под Android.
      - run: cargo check -p kit-secure -p kit-core --target aarch64-linux-android

  scripts:
    name: Сборки — сценарии и донастройка Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Донастройка Android на образце проекта Tauri
        run: bash scripts/test-android-patch.sh
      - name: Новое приложение из заготовки — названия, порты, метки, ссылки на kit
        run: bash scripts/test-new-app.sh
      # shellcheck уже есть на сервере GitHub; actionlint проверяет и сценарии, и команды в них.
      - name: Сценарии GitHub и скрипты
        run: |
          shellcheck scripts/*.sh
          pipx run --spec actionlint-py==1.7.12.25 actionlint

  ui:
    name: Интерфейс — типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  template:
    name: Заготовка нового приложения — сборка и проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: template
          workspaces: template
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Библиотеки WebKit для Tauri
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      # Заготовка берёт kit из этого же репозитория (папкой), поэтому проверяет его нынешнее состояние.
      - name: Интерфейс заготовки
        working-directory: template/app
        run: npm install --no-audit --no-fund && npm run build
      - name: Ядро и мост заготовки
        working-directory: template
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
