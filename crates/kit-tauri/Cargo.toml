[package]
name = "kit-tauri"
description = "Общая часть приложений на Tauri: вход по PIN-коду, отпечатку и Windows Hello, блокировка"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
kit-core = { path = "../kit-core" }
kit-secure = { path = "../kit-secure" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

# Вход по отпечатку — только на телефоне. Сам плагин подключает приложение.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"

[dev-dependencies]
serde_json = "1"
tauri = { version = "2", features = ["test"] }
