[package]
name = "kit-core"
description = "Общее ядро приложений: то, что не зависит от экрана и от системы"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.5"
# Резервная копия: ключ файла и куски — XChaCha20-Poly1305 (STREAM), ключ копий в базе — base64.
chacha20poly1305 = { version = "0.10", features = ["stream"] }
base64 = "0.22"
getrandom = "0.3"
thiserror = "2"
# Коннектор для Claude: ответы JSON, доказательство ключа связи (BLAKE2b), файл расширения .mcpb (ZIP).
blake2 = "0.10"
serde_json = "1"
# Связь коннектора: файл связи и строки обмена посредника с приложением.
serde = { version = "1", features = ["derive"] }
# Облако: файлы событий сжимаются перед шифрованием, номер вложения — SHA-256.
miniz_oxide = "0.8"
sha2 = "0.10"
# Связь по Wi-Fi: общий ключ из кода связи (SPAKE2).
spake2 = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# База приложения (признак db): SQLCipher — та же сборка, что у приложений.
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"], optional = true }

[features]
db = ["dep:rusqlite"]
