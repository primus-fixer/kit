name: Сборки

# Установщик и APK собираются после слияния в main и по кнопке (Actions → Сборки → Run workflow,
# на любой ветке), а не на каждый push: сборки под Windows и Android тратят больше всего минут
# GitHub Actions. Правка только описаний сборку не запускает.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Сборкам токен GitHub нужен только для чтения кода.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Установщик для Windows и APK для Android собирают общие сценарии kit (https://github.com/primus-fixer/kit).
  windows:
    uses: primus-fixer/kit/.github/workflows/windows.yml@__KIT_REV__ # kit __KIT_VERSION__
  android:
    uses: primus-fixer/kit/.github/workflows/android.yml@__KIT_REV__ # kit __KIT_VERSION__
    with:
      title: __NAME__
      key-alias: __ID__
      kit-ref: __KIT_REV__
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      # Псевдоним ключа: __ID__, если не задан этим секретом.
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
