[package]
name = "__ID__-core"
description = "Ядро «__NAME_GEN__»: записи и чем приложение отличается от других на kit"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Общий модуль kit __KIT_VERSION__ (https://github.com/primus-fixer/kit): хранилище записей, обмен по Wi-Fi,
# облако и формат копий. Ссылка — на коммит версии; когда у kit есть метка, `rev` заменяется на `tag`.
kit-core = { git = "https://github.com/primus-fixer/kit", rev = "__KIT_REV__", features = ["store"] }
getrandom = "0.3"
