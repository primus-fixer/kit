[package]
name = "starter-core"
description = "Ядро «Заготовки»: записи, зашифрованная база, обмен по Wi-Fi и через облако"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Общий модуль kit: база, протокол обмена, связь по Wi-Fi, облако, формат копий (https://github.com/primus-fixer/kit).
# KIT — ссылка на kit; scripts/new-app.sh ставит её на коммит kit, из которого сделано приложение.
kit-core = { path = "../../../crates/kit-core", features = ["db"] } # KIT
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
