[package]
name = "__ID__-app"
description = "__DESCRIPTION__"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "__APPLIB__"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
__ID__-core = { path = "../../crates/__ID__-core" }
# Общий модуль kit __KIT_VERSION__ (https://github.com/primus-fixer/kit): ключ базы в хранилище системы,
# вход по PIN-коду, обмен по Wi-Fi и облако в приложении.
kit-core = { git = "https://github.com/primus-fixer/kit", rev = "__KIT_REV__" }
kit-secure = { git = "https://github.com/primus-fixer/kit", rev = "__KIT_REV__" }
kit-tauri = { git = "https://github.com/primus-fixer/kit", rev = "__KIT_REV__" }
# Облако: страница Яндекс ID, где создают пароль приложения, открывается в браузере.
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Вход по отпечатку.
tauri-plugin-biometric = "2"
# QR-код связи по Wi-Fi — камерой телефона.
tauri-plugin-barcode-scanner = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Второй запуск открывает уже работающее окно.
tauri-plugin-single-instance = "2"
